[workspace]
resolver = "3"
members = ["crates/dsh-lite-core", "crates/dsh-ffi", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
url = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The FFI library is not the shipped binary: it is loaded by a native shell, so a
# panic must not unwind into foreign code and the surface is small enough that
# size optimisation costs nothing visible. Everything else matches `release`.
[profile.ffi-release]
inherits = "release"
panic = "abort"
