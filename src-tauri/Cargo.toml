[package]
name = "dsh-desktop"
description = "Lightweight native shell that hosts a locally installed dsh web session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dsh-lite-core = { path = "../crates/dsh-lite-core" }
serde = { workspace = true }
serde_json = "1"
sys-locale = "0.3"
toml = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
