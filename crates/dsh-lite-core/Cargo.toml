[package]
name = "dsh-lite-core"
description = "GUI-free logic for the dsh desktop shell: configuration, dsh discovery, environment probing, launch lifecycle, URL policy and logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
serde_json = "1"
tokio = { version = "1.54.1", features = ["net", "rt", "rt-multi-thread", "time", "io-util", "macros", "sync", "fs"] }
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job objects: the sponsored child must not outlive the shell (src/job.rs).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
